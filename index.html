<div id="app">
  <header class="topo">
    <div><small>Dinheiro</small><strong id="hdDin">€ 0,00</strong></div>

  <main id="tela"></main>
  <nav id="nav" aria-label="Telas do jogo">
    <button data-act="aba" data-v="mercado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 10l1.5-6h13L20 10"/><path d="M4 10a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M6 13v7h12v-7M10 20v-4h4v4"/></svg>Mercado</button>
    <button data-act="aba" data-v="animais"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="11" rx="2" ry="2.7"/><ellipse cx="10" cy="6.5" rx="2" ry="2.8"/><ellipse cx="14.5" cy="6.5" rx="2" ry="2.8"/><ellipse cx="18.5" cy="11" rx="2" ry="2.7"/><path d="M12.2 11.5c-2.8 0-5 3-5 5.5 0 1.8 1.3 2.700 2.700 2.700 1 0 1.600-.5 2.300-.5s1.300.5 2.300.5c1.400 0 2.700-.9 2.700-2.700 0-2.500-2.200-5.500-5-5.500z"/></svg>Animais</button>
    <button data-act="aba" data-v="acasalar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-8-4.700-8-10.500A4.500 4.500 0 0 1 12 7a4.500 4.500 0 0 1 8 2.500C20 15.300 12 20 12 20z"/></svg>Acasalar<span class="badge" id="acaBadge" hidden>0</span></button>
    <button data-act="aba" data-v="wiki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 6c-2-1.500-5-2-8-1.500v14c3-.5 6 0 8 1.500 2-1.500 5-2 8-1.500v-14c-3-.5-6 0-8 1.500zM12 6v14"/></svg>Wikipédia</button>
    <button data-act="aba" data-v="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/></svg>Ranking</button>
    <button data-act="aba" data-v="conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.500 3.500-7 8-7s8 2.500 8 7"/></svg>Conta</button>
  </nav>

  </section>
