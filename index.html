<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caçada da Víbora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: tela única de celular — HUD fino, mundo em canvas no meio, barra de habilidades e abas embaixo; menus sobem como gaveta */
:root{
  --bg:#0c0f0d; --panel:#141a16; --panel2:#1b231e; --line:#2a352e;
  --fg:#e9e3d1; --muted:#8e998f;
  --poison:#9bd84a; --poison-d:#3f6a1f; --gold:#e2ae4a; --gold-d:#8a6420; --blood:#d4473b; --life:#4fbf5a;
  --r0:#d9d4c7; --r1:#6f9cff; --r2:#f0d34f; --r3:#ff8a2b;
  --display:"Grenze Gotisch","Palatino Linotype","Book Antiqua",serif;
  --body:"Alegreya Sans","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--poison);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto;background:var(--bg);border-inline:1px solid var(--line)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hud{padding-block:8px 7px;display:grid;gap:5px;background:var(--panel);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:baseline;gap:10px}
.hero-id{font-family:var(--display);font-size:24px;line-height:1;letter-spacing:.3px}
.lvl{font-size:13px;font-weight:700;color:var(--poison);letter-spacing:.06em;text-transform:uppercase}
.gold{margin-left:auto;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.gold i{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe39a,var(--gold) 55%,var(--gold-d));display:inline-block}
.speed{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:3px 9px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.xp{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.xp i.para{background:linear-gradient(90deg,#5b3d99,#c9a8ff)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--poison);flex:none}
.status #stText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status #hpText{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--fg);flex:none}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#050605}
#cv{position:absolute;inset:0;display:block}
#log{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:10px;top:8px;display:grid;gap:3px;justify-items:start;pointer-events:none;font-size:13px;font-weight:500}
#log div{background:rgba(8,10,9,.66);padding:2px 8px;border-radius:5px;animation:logfade 5s forwards;max-width:100%}
@keyframes logfade{0%,80%{opacity:1}100%{opacity:0}}
#townCard{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;background:rgba(17,22,19,.93);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.tc-head{display:flex;align-items:baseline;gap:10px}
.tc-name{font-family:var(--display);font-size:22px;line-height:1}
#tcInfo{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.tc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tcGo{grid-column:1/-1}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:15px;line-height:1.15}
.btn.primary{background:var(--poison-d);border-color:var(--poison);color:#f2ffe2}
.btn.gold{border-color:var(--gold-d);color:var(--gold)}
.btn.warn{border-color:#7a2d26;color:#ff8c80}
.btn:disabled{opacity:.38;cursor:default}
.btn small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}

.skillbar{display:flex;gap:10px;justify-content:center;padding-block:8px;background:var(--panel);border-top:1px solid var(--line)}
.sk{touch-action:none;-webkit-touch-callout:none;position:relative;width:58px;height:58px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,#24301f,var(--panel2));display:grid;place-items:center;color:var(--poison);padding:0;overflow:hidden}
.sk svg{width:30px;height:30px}
.sk::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) calc(var(--cd,0)*360deg),transparent 0)}
.sk .rk{position:absolute;right:5px;bottom:2px;font-size:11px;font-weight:800;color:var(--fg);z-index:1}
.sk .cdn{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;z-index:1;text-shadow:0 1px 3px #000}
.sk .off{position:absolute;left:4px;top:3px;font-size:10px;font-weight:800;color:#ff8c80;z-index:1;letter-spacing:.05em}
.sk.locked{opacity:.32}
.sk.disabled{filter:grayscale(1);opacity:.55}
.sk.ready{border-color:var(--poison-d);box-shadow:0 0 10px rgba(155,216,74,.3)}
.sk.queued{border-color:var(--gold)}
#townBtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;align-items:center;gap:7px;padding:9px 14px 9px 11px;border-radius:24px;border:1px solid #4a5fa8;background:rgba(18,22,40,.88);color:#cfdcff;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#townBtn svg{width:22px;height:22px;color:#a9c4ff}
.shop{display:grid;gap:10px}
.offer{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.offer .on{font-weight:800;font-size:15px;line-height:1.2}
.offer .om{font-size:12px;color:var(--muted)}
.offer .oa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.price{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.sk.fire{border-color:var(--poison);box-shadow:0 0 14px rgba(155,216,74,.45) inset}

.rk-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rk-list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.rk-list li.me{border-color:var(--poison);box-shadow:0 0 0 1px var(--poison) inset}
.rk-list .pos{font-family:var(--display);font-size:22px;line-height:1;color:var(--muted);text-align:center}
.rk-list li:nth-child(1) .pos{color:#ffd24a}.rk-list li:nth-child(2) .pos{color:#d9d4c7}.rk-list li:nth-child(3) .pos{color:#d08a4a}
.rk-list .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-list .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rk-list .lv{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.rk-list .lv .p{color:#c9a8ff}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line)}
.nav button{position:relative;background:none;border:0;display:grid;justify-items:center;gap:1px;padding:7px 0 8px;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.04em}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--fg)}
.nav button.on svg{color:var(--poison)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--poison);color:#0d1a05;font-size:11px;font-weight:800;display:grid;place-items:center}

#sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet-card{position:relative;width:100%;max-width:820px;margin:0 auto;max-height:84%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;text-wrap:balance}
.sheet-head .btn{margin-left:auto;padding:7px 12px;font-size:14px}
.sheet-body{overflow-y:auto;padding-block:4px 22px;display:grid;gap:16px;-webkit-overflow-scrolling:touch}
.sec{display:grid;gap:8px}
.sec h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .r{margin-left:auto;letter-spacing:.02em;text-transform:none;font-size:13px;color:var(--fg)}
.note{font-size:13px;color:var(--muted);margin:0}

.maps{display:grid;gap:10px}
.mapc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);display:grid;gap:6px;position:relative;overflow:hidden}
.mapc.here{border-color:var(--poison)}
.mapc.lock{opacity:.5}
.mapc .mh{display:flex;align-items:baseline;gap:8px}
.mapc .mn{font-family:var(--display);font-size:22px;line-height:1}
.mapc .ml{margin-left:auto;font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.mapc .mm{font-size:13px;color:var(--muted)}
.mapc .swatch{position:absolute;inset:0 auto 0 0;width:4px}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--poison)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.stat{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-block:4px;font-size:14px}
.stat span{color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums}
.stat.big{grid-column:1/-1;font-size:17px}
.stat.big b{color:var(--poison)}

.eqgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid-inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:11px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--rc,var(--r0));padding:0}
.tile svg{width:58%;height:58%}
.tile.r1{border-color:#2f4680;background:linear-gradient(160deg,#1a2338,var(--panel2))}
.tile.r2{border-color:#7a6a22;background:linear-gradient(160deg,#2c2915,var(--panel2))}
.tile.r3{border-color:#a8561a;background:linear-gradient(160deg,#3a2210,var(--panel2));box-shadow:0 0 10px rgba(255,138,43,.25)}
.tile .lbl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.tile.empty{color:var(--line)}
.tile .up{position:absolute;top:2px;right:4px;font-size:11px;color:var(--poison);font-weight:800}
.bulk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.skill{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2)}
.skill .ico{width:44px;height:44px;border-radius:11px;background:var(--bg);display:grid;place-items:center;color:var(--poison)}
.skill .ico svg{width:26px;height:26px}
.skill.locked{opacity:.5}
.skill .sn{font-weight:800;font-size:15px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.skill .sn em{font-style:normal;font-weight:700;font-size:12px;color:var(--muted)}
.skill .sd{font-size:13px;color:var(--muted);line-height:1.35}
.skill .ctl{display:grid;gap:6px;justify-items:end}
.rank{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);font-size:14px}
.plus{width:38px;height:34px;border-radius:9px;border:1px solid var(--poison);background:var(--poison-d);color:#f2ffe2;font-weight:800;font-size:20px;line-height:1;padding:0}
.plus:disabled{opacity:.3;border-color:var(--line);background:var(--bg)}
.tog{font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:7px;padding:4px 7px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.tog.on{color:var(--poison);border-color:var(--poison-d)}

.row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.row label{flex:1;font-size:15px;min-width:0}
.row label small{display:block;color:var(--muted);font-size:12px}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:var(--bg);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch:checked{background:var(--poison-d);border-color:var(--poison)}
.switch:checked::after{transform:translateX(20px);background:#f2ffe2}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
.retbox{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.retbox .big{font-family:var(--display);font-size:34px;line-height:1;color:var(--life)}
input[type=range]{width:100%;accent-color:var(--life);height:28px}

#dlg{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#dlg .sheet-back{background:rgba(0,0,0,.6)}
.dcard{position:relative;width:min(420px,100%);max-height:88%;overflow-y:auto;background:var(--panel);border:1px solid var(--rc,var(--line));border-radius:16px;padding:16px;display:grid;gap:10px}
.dname{font-family:var(--display);font-size:26px;line-height:1.05;color:var(--rc);text-wrap:balance;margin:0}
.dtype{font-size:13px;color:var(--muted);margin-top:-4px}
.dbase{font-size:15px;font-weight:700}
.daff{display:grid;gap:3px;font-size:14px;color:#c7d2ff;margin:0;padding:0;list-style:none}
.daff .perf{color:var(--r3)}
.daff .sk2{color:var(--r3);font-weight:700}
.cmp{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.cmp .p{color:var(--poison);font-weight:700}
.cmp .n{color:#ff8c80;font-weight:700}
.diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;font-size:13px}
.diff h4{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.diff ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.diff .dg h4,.diff .dg li{color:var(--poison)}
.diff .dl h4,.diff .dl li{color:#ff8c80}
.diff li.none{color:var(--muted)}
.dact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dact .full{grid-column:1/-1}
.legend{font-size:12px;color:var(--muted)}
input,textarea{user-select:text;-webkit-user-select:text}
.tile .il{position:absolute;top:2px;left:4px;font-size:10px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.bad{color:#ff8c80}
.mapc .mi{font-size:13px;display:flex;gap:4px 14px;flex-wrap:wrap;color:var(--muted)}
.g-ok{color:var(--poison)} .g-mid{color:var(--gold)} .g-bad{color:#ff8c80}
#create{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto}
.cr{max-width:540px;margin:0 auto;padding-block:28px 36px;display:grid;gap:18px}
.cr h1{font-family:var(--display);font-size:42px;line-height:1;margin:0;text-wrap:balance}
.cr .lead{margin:-8px 0 0;color:var(--muted);font-size:15px}
.cr .field{display:grid;gap:6px}
.cr .field span,.cr h3{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.txtin{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font:700 18px var(--body);width:100%}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px 6px;display:grid;gap:4px;justify-items:center;text-align:center;font-weight:800;font-size:15px}
.opt svg{width:30px;height:30px;color:var(--poison)}
.opt.on{border-color:var(--poison);box-shadow:0 0 0 1px var(--poison) inset}
.opt:disabled{opacity:.38;cursor:default}
.opt small{font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.saveok{font-size:13px;color:var(--poison)}
@media (prefers-reduced-motion:reduce){#log div{animation:none}}
</style>

<div id="app">
  <header class="hud gut">
    <div class="hud-top">
      <span class="hero-id" id="heroName">Víbora</span><span class="lvl" id="lvText">Nv 1</span>
      <span class="gold"><i></i><span id="goldText">0</span></span>
      <button class="speed" id="speedBtn" data-act="speed" aria-label="Velocidade do jogo">x1</button>
    </div>
    <div class="xp" aria-hidden="true"><i id="xpBar"></i></div>
    <div class="status"><span class="dot" id="stDot"></span><span id="stText">Caçando</span><span id="hpText"></span></div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="log" aria-live="polite"></div>
    <button id="townBtn" data-act="goTown" hidden aria-label="Voltar para a vila"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="6" ry="9"/><ellipse cx="12" cy="12" rx="2.5" ry="5" fill="currentColor" fill-opacity=".35"/></svg>Voltar à vila</button>
    <div id="townCard" hidden>
      <div class="tc-head"><span class="tc-name">Vila de Brejal</span><span id="tcInfo"></span></div>
      <div class="tc-actions">
        <button class="btn gold" id="tcSell" data-act="sellR" data-v="0">Vender comuns</button>
        <button class="btn gold" id="tcShop" data-act="tab" data-v="shop">Mercador</button>
        <button class="btn primary" id="tcGo" data-act="go">Partir</button>
      </div>
    </div>
  </main>
  <div class="skillbar gut" id="skillbar"></div>
  <nav class="nav gut" id="nav">

const SLOTS = ['bow','helm','chest','gloves','boots','ring','amulet'];
const SLOT_N = {bow:'Arco',helm:'Capuz',chest:'Peitoral',gloves:'Luvas',boots:'Botas',ring:'Anel',amulet:'Amuleto'};
const BOWS = [{lv:0,n:'Arco Curto',aps:1.3,m:1},{lv:8,n:'Arco de Caça',aps:1.2,m:1.12},{lv:16,n:'Arco Longo',aps:1.05,m:1.32},{lv:24,n:'Arco Composto',aps:1.15,m:1.3},{lv:32,n:'Arco de Guerra',aps:1.1,m:1.42}];
const BASES = {

const AFX = {
  life:{n:v=>`+${v} de vida`,lo:l=>4+l*1.5,hi:l=>12+l*4.2,slots:SLOTS},

  critd:{n:v=>`+${v}% de dano crítico`,lo:()=>8,hi:()=>45,slots:['bow','gloves','amulet','ring']},

};
const SUF = {life:'do Vigor',pois:'da Peçonha',ias:'da Pressa',crit:'da Precisão',critd:'do Abate',ms:'do Vento',armor:'da Muralha',ls:'do Vampiro',cdr:'do Fluxo',pdur:'da Agonia',gf:'da Fortuna'};
const RA = ['Presa','Sussurro','Agouro','Espinho','Mordida','Lamento','Véu','Garra','Sombra','Sopro','Ferrão','Prece'];
const RB = ['Fel','Cinzas','Musgo','Ossos','Víbora','Cripta','Névoa','Peste','Corvo','Brejo','Cicuta','Lodo'];
const LEG = {bow:['Sussurro da Víbora','Corda de Basilisco'],helm:['Coroa do Pântano','Capuz da Mamba'],chest:['Pele da Hidra','Manto da Cicuta'],gloves:['Toque Pestilento','Dedos de Áspide'],boots:['Passos do Charco','Botas da Naja'],ring:['Olho da Serpente','Aliança Verde'],amulet:['Coração de Peçonha','Lágrima de Cobra']};

/* ---------- ESTADO SALVO ---------- */
const KEY = 'cacada-vibora-v1';
const startBow = () => ({id:0,slot:'bow',rar:0,ilvl:1,base:'Arco Simples',name:'Arco Simples',min:3,max:6,aps:1.2,affix:[],bt:0});
const defaults = () => ({lv:1,xp:0,par:0,pxp:0,pp:{dmg:0,pois:0,life:0,ias:0},gold:0,inv:[],eq:{bow:startBow()},sk:{arrow:1,fan:0,rain:0,burst:0,tip:0,potency:0,agility:0,hide:0,contagion:0},auto:{arrow:true,fan:true,rain:true,burst:true},cfg:{ret:35,retFull:true,autoGo:true,autoSell:false,minPick:0},map:'campos',speed:1,kills:0,uid:1,legs:0,char:null,ver:2,shop:[]});
// O save usa sempre a mesma chave: versões novas do jogo leem o progresso antigo.
function normalize(s){
  const d = defaults();
  Object.assign(d, s, {sk:{...d.sk,...(s.sk||{})},auto:{...d.auto,...(s.auto||{})},cfg:{...d.cfg,...(s.cfg||{})},pp:{...d.pp,...(s.pp||{})}});
  // Saves antigos sem limite de nível: o que passou de 40 vira Paragon
  if(d.lv > MAX_LV){ d.par += d.lv - MAX_LV; d.lv = MAX_LV; d.xp = 0; }
  if(Object.values(d.sk).reduce((a, v) => a + v, 0) > d.lv) d.sk = defaults().sk;
  if(!d.eq) d.eq = {};
  if(!Array.isArray(d.inv)) d.inv = [];
  if(!Array.isArray(d.shop)) d.shop = [];
  if(!d.char && (d.lv > 1 || d.kills > 0)) d.char = {name:'Víbora',cls:'arqueiro',build:'veneno',color:0};
  d.ver = 2;
  return d;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){}
  return defaults();
}
const encodeSave = () => 'VIBORA1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decodeSave(txt){
  txt = (txt || '').trim();
  try{ if(txt.startsWith('VIBORA1:')) txt = decodeURIComponent(escape(atob(txt.slice(8)))); const o = JSON.parse(txt); return o && typeof o.lv === 'number' ? o : null; }catch(e){ return null; }
}
const heroName = () => S.char ? S.char.name : 'Víbora';
const CLOAKS = [{n:'Musgo',a:'#2b4d30',b:'#3f6b3b',h:'#1f3a25'},{n:'Couro',a:'#5a3f26',b:'#7a5a38',h:'#3e2a19'},{n:'Noite',a:'#28344f',b:'#3c4c70',h:'#1b2438'},{n:'Sangue',a:'#5a2224',b:'#7d3336',h:'#3d1618'}];
const CLASSES = [{id:'arqueiro',n:'Arqueiro',d:'Ataca de longe com arco',ok:1},{id:'guerreiro',n:'Guerreiro',d:'Em breve'},{id:'feiticeira',n:'Feiticeira',d:'Em breve'}];
const BUILDS = [{id:'veneno',n:'Veneno',d:'Dano ao longo do tempo',ok:1},{id:'gelo',n:'Gelo',d:'Em breve'},{id:'fogo',n:'Fogo',d:'Em breve'}];
const xpMult = md => { const over = S.lv - md.lv[1]; return over > 0 ? Math.max(.05, 1 - over*.12) : 1; };
const avgIlvl = () => Math.round(SLOTS.reduce((t, k) => t + (S.eq[k] ? S.eq[k].ilvl : 0), 0) / SLOTS.length);
const mapRec = md => Math.max(0, md.lv[0] - 2);

/* ---------- ITENS ---------- */
const skew = () => Math.pow(Math.random(), 2.6); // valores altos são raros
function genItem(ilvl, rar, slot){
  slot = slot || (Math.random() < .22 ? 'bow' : pick(SLOTS.slice(1)));
  const rf = [1,1,1.15,1.35][rar];
  const it = {id:S.uid++, slot, rar, ilvl, affix:[]};
  if(slot === 'bow'){
    const b = BOWS.slice().reverse().find(x => ilvl >= x.lv);
    const t = skew(), base = (3 + ilvl*1.5) * b.m * (1 + .45*t) * rf;
    it.min = Math.max(1, Math.round(base)); it.max = Math.max(it.min+1, Math.round(base*rnd(1.75,2.05)));
    it.aps = b.aps; it.base = b.n; it.bt = t;
  } else {
    it.base = BASES[slot][Math.min(3, Math.floor(ilvl/10))];
    if(ARMOR_M[slot]){ const t = skew(); it.armor = Math.round((3 + ilvl*1.3) * ARMOR_M[slot] * (1 + .5*t) * rf); it.bt = t; }
  }
  const n = [0, rint(1,2), rint(3,4), 4][rar];
  const pool = Object.keys(AFX).filter(k => AFX[k].slots.includes(slot));
  for(let i = 0; i < n && pool.length; i++){
    const k = pool.splice(Math.floor(Math.random()*pool.length), 1)[0], A = AFX[k], t = skew();
    const lo = A.lo(ilvl), hi = A.hi(ilvl) * rf;
    let v = lo + (hi - lo) * t; v = A.dec ? Math.round(v*10)/10 : Math.max(1, Math.round(v));
    it.affix.push({k, v, t});
  }
  if(rar === 3){ const s = pick([...ACTIVE, ...PASSIVE]); const v = Math.random() < .12 ? 2 : 1; it.affix.push({k:'skill', s, v, t:v===2?1:.5}); }
  it.name = nameItem(it);
  return it;
}
function nameItem(it){
  if(it.rar === 0) return it.base;
  if(it.rar === 1) return `${it.base} ${SUF[it.affix[0].k] || ''}`.trim();
  if(it.rar === 2) return `${pick(RA)} de ${pick(RB)}`;
  return pick(LEG[it.slot]);
}
function rollRar(elite){
  const r = Math.random(), m = elite ? 4 : 1;
  if(r < .003*m) return 3;
  if(r < .035*m) return 2;
  if(r < .22*(elite?2:1)) return 1;
  return 0;
}
function shopRar(){ const r = Math.random(); if(r < .03) return 3; if(r < .25) return 2; if(r < .7) return 1; return 0; }
function rollShop(){ S.shop = [0,1,2].map(() => genItem(Math.max(1, S.lv), shopRar())); }
const buyPrice = it => Math.round(sellPrice(it) * 4);
const sellPrice = it => Math.round((4 + it.ilvl*2) * [1,3,9,40][it.rar]);

/* ---------- STATUS ---------- */
function calcStats(eq = S.eq){
  const a = {life:0,armor:0,pois:0,ias:0,crit:0,critd:0,ms:0,ls:0,cdr:0,pdur:0,gf:0}, bonus = {};
  let wmin = 1, wmax = 2, aps = 1.1;
  for(const slot of SLOTS){
    const it = eq[slot]; if(!it) continue;
    if(it.slot === 'bow'){ wmin = it.min; wmax = it.max; aps = it.aps; }
    if(it.armor) a.armor += it.armor;
    for(const af of it.affix){ if(af.k === 'skill') bonus[af.s] = (bonus[af.s]||0) + af.v; else a[af.k] += af.v; }
  }
  const L = S.lv;
  const rk = id => S.sk[id] > 0 ? S.sk[id] + (bonus[id]||0) : 0;
  const pp = S.pp || {}, dm = (1 + L*.03) * (1 + .01*(pp.dmg || 0)), st = {rk, bonus};
  st.min = wmin*dm; st.max = wmax*dm; st.avg = (st.min + st.max)/2;
  st.aps = aps * (1 + a.ias/100) * (1 + .05*rk('agility')) * (1 + .005*(pp.ias || 0));
  st.crit = Math.min(75, 5 + a.crit); st.critd = 150 + a.critd;
  st.pois = 1 + a.pois/100 + .12*rk('potency') + .015*(pp.pois || 0);
  st.pdur = 1 + a.pdur/100;
  st.life = (70 + L*14 + a.life) * (1 + .07*rk('hide')) * (1 + .01*(pp.life || 0));
  st.armor = a.armor + 3*rk('hide');
  st.ms = 125 * (1 + a.ms/100);
  st.ls = a.ls; st.cdr = Math.min(40, a.cdr); st.gf = a.gf;
  const critF = 1 + st.crit/100 * (st.critd/100 - 1), cdm = 1 - st.cdr/100;
  const tip = rk('tip') ? (.4 + .2*rk('tip')) * st.pois : 0;
  let dps = st.avg * st.aps * critF * (1 + tip);
  const r1 = rk('arrow'); if(r1) dps += (st.avg*(1.2+.15*r1)*critF + st.avg*(1.5+.4*r1)*st.pois) / (4*cdm);
  const r2 = rk('fan'); if(r2) dps += 2.5*(st.avg*(.6+.08*r2)*critF + st.avg*(.6+.15*r2)*st.pois) / (7*cdm);
  const r3 = rk('rain'); if(r3) dps += 2.5*4*st.avg*(.6+.15*r3)*st.pois / (10*cdm);
  st.dps = dps;
  return st;
}
let ST = calcStats();
function refreshStats(){ ST = calcStats(); if(hero.hp > ST.life) hero.hp = ST.life; }
const xpNeed = L => Math.floor(35*L + 18*L*L);
const ptsFree = () => S.lv - Object.values(S.sk).reduce((s, v) => s + v, 0);

function skDesc(id, st){
  const r = Math.max(1, st.rk(id)), a = st.avg, p = st.pois, d = st.pdur;
  switch(id){
    case 'arrow': return `Causa ${pc(1.2+.15*r)} do dano da arma e envenena: ${fmt(a*(1.5+.4*r)*p)} de dano em ${n1(4*d)}s.`;
    case 'fan': return `Dispara ${5+Math.floor(r/3)} flechas em leque. Cada uma causa ${pc(.6+.08*r)} e envenena ${fmt(a*(.6+.15*r)*p)} em ${n1(3*d)}s. Um inimigo colado em você leva todas as flechas.`;

    case 'burst': return `Detona o veneno dos inimigos próximos: causa ${pc(.5+.1*r)} do veneno restante na hora e espalha 30% para os vizinhos.`;

/* ---------- MIRA ---------- */
// Celular: segurar o botão e arrastar como um joystick; soltar lança. Toque rápido = mira automática.
// PC: segurar a tecla e apontar com o mouse; soltar lança. Esc ou botão direito cancela.
const AIMABLE = {fan:1, rain:1}, AIM_RANGE = RANGE + 40, AIM_DRAG = 70, AIM_DEAD = 14, FAN_LEN = 360, FAN_SPREAD = .95, FAN_CLOSE = 38;
const fanCount = () => 5 + Math.floor(ST.rk('fan')/3);
const fanAng = (base, i, n) => base - FAN_SPREAD/2 + FAN_SPREAD*i/(n - 1);
// Criatura "colada" na frente do herói, que leva todas as flechas do leque
function fanPointBlank(base){
  let best = null, bd = 1e9;
  for(const m of mons){
    if(m.dead) continue;
    const d = D(m, hero); if(d > m.r + FAN_CLOSE || d >= bd) continue;
    let da = Math.atan2(m.y - hero.y, m.x - hero.x) - base; da = Math.atan2(Math.sin(da), Math.cos(da));
    if(Math.abs(da) <= FAN_SPREAD/2 + .4){ best = m; bd = d; }
  }
  return best;
}
let aim = null, skipClickT = 0;
const mouse = {x:0, y:0, on:false};
const toWorld = (sx, sy) => ({x: cam.x + (sx - cw/2)/zoom, y: cam.y + (sy - ch/2)/zoom});

function aimPoint(){
  if(!aim) return null;
  let dx = Math.cos(hero.face), dy = Math.sin(hero.face), k = AIM_RANGE*.6;
  if(aim.src === 'key'){
    if(mouse.on){ const w = toWorld(mouse.x, mouse.y); const ex = w.x - hero.x, ey = w.y - hero.y; k = Math.hypot(ex, ey); if(k > 1){ dx = ex/k; dy = ey/k; } }
  } else {
    const L = Math.hypot(aim.dx, aim.dy);
    if(L > 1){ dx = aim.dx/L; dy = aim.dy/L; }
    k = Math.min(1, L/AIM_DRAG) * AIM_RANGE;
  }
  if(aim.id === 'fan') k = FAN_LEN; // o Leque só usa a direção
  k = Math.min(k, aim.id === 'fan' ? FAN_LEN : AIM_RANGE);
  return {x: clamp(hero.x + dx*k, 20, WORLD.w - 20), y: clamp(hero.y + dy*k, 20, WORLD.h - 20), ang: Math.atan2(dy, dx)};
}
function aimRelease(){
  const a = aim; if(!a) return;
  const p = aimPoint(); aim = null;
  if(a.src === 'touch'){
    if(!a.moved) return manualCast(a.id);
    if(Math.hypot(a.dx, a.dy) < AIM_DEAD) return; // voltou o dedo pro centro: cancela

// Alvo fixo: clicar/tocar numa criatura faz o herói focar nela; a Flecha Venenosa vai nela.
const ARROW_REACH = 480;
let focus = null, cursorCache = '';
function getFocus(){ if(focus && (focus.dead || !mons.includes(focus))) focus = null; return focus; }
function setFocus(m){
  focus = m || null;

  if(hero.atk && !hero.atk.rel) hero.atk.tgt = m;
  ring(m.x, m.y + m.r*.55, m.r*1.6, '#ff8c5a', .35, 2);
}
function monAt(sx, sy, pad){
  const w = toWorld(sx, sy); let best = null, bd = 1e9;
  for(const m of mons){ if(m.dead) continue; const d = Math.hypot(m.x - w.x, m.y - w.y); if(d < m.r*1.4 + pad/zoom && d < bd){ bd = d; best = m; } }

}
const hoverMon = () => mouse.on && mouse.x >= 0 && mouse.y >= 0 && mouse.x <= cw && mouse.y <= ch && scene === 'map' ? monAt(mouse.x, mouse.y, 6) : null;
function drawFocus(){

  ctx.save();

  if(f) mark(f, `rgba(255,110,70,${.75 + .2*Math.sin(T*6)})`, 2.5);
  ctx.restore();
}
function drawAim(){
  if(!aim || (aim.src === 'touch' && (!aim.moved || Math.hypot(aim.dx, aim.dy) < AIM_DEAD))) return;
  const p = aimPoint(), bad = cds[aim.id] > 0;
  const c = bad ? '255,120,100' : '155,216,74';
  ctx.save();
  if(aim.id === 'rain'){
    ctx.strokeStyle = `rgba(${c},.22)`; ctx.lineWidth = 1.5; ctx.setLineDash([4, 7]);

    ctx.strokeStyle = `rgba(${c},.55)`; line(hero.x, hero.y, p.x, p.y); ctx.setLineDash([]);
    const rad = 70 + 5*ST.rk('rain');
    ctx.fillStyle = `rgba(${c},.18)`; ell(p.x, p.y, rad, rad*.8);
    ctx.strokeStyle = `rgba(${c},.85)`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(p.x, p.y, rad, rad*.8, 0, 0, TAU); ctx.stroke();

    for(let i = 0; i < n; i++){
      const an = fanAng(p.ang, i, n), cs = Math.cos(an), sn = Math.sin(an);
      const x0 = hero.x + cs*14, y0 = hero.y + sn*14, x1 = hero.x + cs*FAN_LEN, y1 = hero.y + sn*FAN_LEN;
      const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, `rgba(${c},.85)`); g.addColorStop(1, `rgba(${c},.15)`);

    ctx.setLineDash([]);
    if(pb){
      ctx.strokeStyle = `rgba(${c},.95)`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(pb.x, pb.y, pb.r*1.6, pb.r*1.3, 0, 0, TAU); ctx.stroke();
      ctx.font = '800 15px "Alegreya Sans", sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText('×' + n, pb.x, pb.y - pb.r - 16); ctx.fillStyle = `rgb(${c})`; ctx.fillText('×' + n, pb.x, pb.y - pb.r - 16);

/* ---------- ATUALIZAÇÃO ---------- */
function moveDir(ang, dt, mul){
  const s = ST.ms * (mul || 1) * dt;
  const nx = clamp(hero.x + Math.cos(ang)*s, 20, WORLD.w - 20), ny = clamp(hero.y + Math.sin(ang)*s, 20, WORLD.h - 20);
  const moved = Math.abs(nx - hero.x) + Math.abs(ny - hero.y) > s*.3;
  hero.x = nx; hero.y = ny; hero.moving = true; hero.walkT += dt;
  return moved;
}
function moveTo(p, dt, mul){
  const d = D(hero, p); if(d < 5){ hero.moving = false; return true; }
  hero.face = Math.atan2(p.y - hero.y, p.x - hero.x); moveDir(hero.face, dt, mul); return false;
}
function heroAI(dt){
  const pct = hero.hp / ST.life * 100;
  if(pct <= S.cfg.ret){ startPortal('town', `Vida em ${Math.round(pct)}%. Voltando para a cidade.`); return; }
  if(S.cfg.retFull && S.inv.length >= INV_MAX){ startPortal('town', 'Mochila cheia. Voltando para a cidade.'); return; }
  if(hero.cast){ hero.moving = false; return; }
  const foc = getFocus(), near = foc || nearestMon(hero), nd = near ? D(near, hero) : 1e9;
  if(hero.atk && !hero.atk.rel){ hero.moving = false; const t = hero.atk.tgt; if(t && !t.dead) hero.face = Math.atan2(t.y - hero.y, t.x - hero.x); return; }
  if(near && (nd < 300 || foc)){
    const ang = Math.atan2(near.y - hero.y, near.x - hero.x);
    hero.face = ang;
    if(!near.d.ranged && nd < 46 && hero.kite < .7){
      const away = ang + Math.PI;
      if(moveDir(away, dt, .9)){ hero.kite += dt; hero.face = ang; return; }
      hero.kite = 1;
    }
    if(nd > RANGE){ moveDir(ang, dt); return; }
    hero.moving = false;
    if(!hero.atk) hero.atk = {t:0, dur:1/ST.aps, rel:false, tgt:near};
  } else {
    let dr = null, dd = 1e9;
    if(S.inv.length < INV_MAX) for(const d of drops) if(!d.gone && d.it.rar >= S.cfg.minPick){ const x = D(d, hero); if(x < dd){ dd = x; dr = d; } }
    if(dr && dd < 700) moveTo(dr, dt);
    else if(near) moveTo(near, dt);
    else hero.moving = false;
  }
}
function heroTimers(dt){
  hero.hit = Math.max(0, hero.hit - dt);
  if(hero.atk){
    const a = hero.atk; a.t += dt;
    if(!a.rel && a.t >= a.dur*.55){ a.rel = true; hero.kite = 0; fireBasic(a.tgt); }
    if(a.t >= a.dur) hero.atk = null;
  }
  if(hero.cast){
    const c = hero.cast; c.t += dt;
    if(Math.random() < .5) { const an = Math.random()*TAU; part({x:hero.x + Math.cos(an)*18, y:hero.y + Math.sin(an)*18, vy:-30, life:.4, size:2, c:'#b8f070'}); }
    if(!c.done && c.t >= c.dur*.6){ c.done = true; doSkill(c); }
    if(c.t >= c.dur){ hero.cast = null; if(hero.queued){ const q = hero.queued, qa = hero.queuedAim; hero.queued = hero.queuedAim = null; manualCast(q, qa); } }
  }
}
function monUpdate(m, dt){
  if(m.dead){ m.deadT += dt; return; }
  if(m.poisons.length){
    let dmg = 0;
    for(const p of m.poisons){ dmg += p.dps * Math.min(dt, p.t); p.t -= dt; }
    m.poisons = m.poisons.filter(p => p.t > 0);
    m.hp -= dmg; m.pAcc += dmg; m.pT -= dt;
    if(m.pT <= 0){ m.pT = .6; if(m.pAcc >= 1){ txt(m.x + rnd(-10,10), m.y - m.r - 4, fmt(m.pAcc), '#9bd84a', 12, -26); m.pAcc = 0; } }
    if(Math.random() < dt*5) part({x:m.x + rnd(-m.r, m.r), y:m.y + rnd(-m.r*.5, m.r*.5), vy:rnd(-40,-20), life:.7, size:rnd(1.5,3), c:'#8fd14f', kind:'bubble'});
    if(m.hp <= 0){ kill(m); return; }
  }
  m.hit = Math.max(0, m.hit - dt); m.acd -= dt; m.anim += dt;
  const live = mode === 'hunt' || mode === 'portal';
  const d = D(m, hero);
  if(live && !m.aggro && d < 240) m.aggro = true;
  if(!live) m.aggro = false;
  if(m.atkT > 0){
    m.atkT -= dt; m.moving = false;
    if(!m.fired && m.atkT <= .18){
      m.fired = true;
      if(m.d.ranged){ const an = Math.atan2(hero.y - m.y, hero.x - m.x); projs.push({x:m.x, y:m.y, vx:Math.cos(an)*260, vy:Math.sin(an)*260, a:an, life:1.6, hostile:true, mon:m, dmg:m.dmg, c:m.d.ranged}); }
      else if(d < m.d.range + m.r + 18) hurtHero(m.dmg, m);
    }
    return;
  }
  if(m.aggro){
    m.face = Math.atan2(hero.y - m.y, hero.x - m.x);
    const reach = m.d.ranged ? m.d.range : m.d.range + m.r;
    if(d > reach){ m.x += Math.cos(m.face)*m.spd*dt; m.y += Math.sin(m.face)*m.spd*dt; m.moving = true; }
    else { m.moving = false; if(m.acd <= 0){ m.atkT = .36; m.fired = false; m.acd = m.d.acd; } }
  } else {
    m.wt -= dt;
    if(m.wt <= 0){ m.wx = m.x + rnd(-90,90); m.wy = m.y + rnd(-90,90); m.wt = rnd(2,5); }
    const wd = Math.hypot(m.wx - m.x, m.wy - m.y);
    if(wd > 6){ m.face = Math.atan2(m.wy - m.y, m.wx - m.x); m.x += Math.cos(m.face)*m.spd*.3*dt; m.y += Math.sin(m.face)*m.spd*.3*dt; m.moving = true; } else m.moving = false;
  }
  m.x = clamp(m.x, 20, W_MAP - 20); m.y = clamp(m.y, 20, W_MAP - 20);
}
function separate(){
  const L = mons.length;
  for(let i = 0; i < L; i++){
    const a = mons[i]; if(a.dead) continue;
    for(let j = i + 1; j < L; j++){
      const b = mons[j]; if(b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r)*.9, d2 = dx*dx + dy*dy;
      if(d2 < min*min && d2 > .01){ const d = Math.sqrt(d2), p = (min - d)/2, ux = dx/d, uy = dy/d; a.x -= ux*p; a.y -= uy*p; b.x += ux*p; b.y += uy*p; }
    }
    const dx = a.x - hero.x, dy = a.y - hero.y, min = a.r + 10, d = Math.hypot(dx, dy);
    if(d < min && d > .01){ a.x = hero.x + dx/d*min; a.y = hero.y + dy/d*min; }
  }
}
function updateField(dt){
  for(const k in cds) cds[k] = Math.max(0, cds[k] - dt);
  spawnT -= dt;
  if(spawnT <= 0 && mons.filter(m => !m.dead).length < 16 && mode === 'hunt'){ spawnPack(false); spawnT = 1.2; }
  heroTimers(dt);
  if(mode === 'hunt'){ if(T - (hero.lastHit || 0) > 3 && hero.hp < ST.life) hero.hp = Math.min(ST.life, hero.hp + ST.life*.02*dt); heroAI(dt); }
  else if(mode === 'portal'){
    portal.t += dt;
    if(portal.t > .9) moveTo(portal, dt, .7);
    if(portal.t > 1.2) hero.scale = Math.max(0, hero.scale - dt*2.5);
    if(portal.t > 1.5) transition(() => portal && portal.dest === 'map' ? enterMap(S.map) : enterTown());
  } else if(mode === 'dead'){
    deadT += dt; hero.alpha = Math.max(0, 1 - deadT*.8);

  }
  for(const m of mons) monUpdate(m, dt);

  mons = mons.filter(m => !m.dead || m.deadT < 1.6);
  for(const p of projs){
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.hostile){
      if(hero.scale > .6 && mode !== 'dead' && Math.hypot(p.x - hero.x, p.y - hero.y) < 14){ hurtHero(p.dmg, p.mon); p.life = 0; }
    } else {
      if(p.kind !== 'arrow' && Math.random() < .6) part({x:p.x, y:p.y, life:.3, size:2, c:p.kind === 'farrow' ? '#d8f07a' : '#9bd84a'});
      for(const m of mons){
        if(m.dead) continue;
        if(Math.hypot(p.x - m.x, p.y - m.y) < m.r + 5){
          dealHit(m, p.dmg, p.crit);
          if(p.pois) poison(m, p.pois, p.pdur);
          for(let i = 0; i < 4; i++) part({x:p.x, y:p.y, vx:rnd(-60,60), vy:rnd(-60,60), life:.25, size:2, c:p.pois ? '#9bd84a' : '#f3efe2'});

    if(Math.random() < dt*30){ const an = Math.random()*TAU, rr = Math.sqrt(Math.random())*c.r; part({x:c.x + Math.cos(an)*rr, y:c.y + Math.sin(an)*rr*.8 - 60, vy:300, life:.2, size:1.5, c:'#c8f080', kind:'streak'}); }
  }

  for(const l of later) l.t -= dt;
  const due = later.filter(l => l.t <= 0); later = later.filter(l => l.t > 0); due.forEach(l => l.fn());
  for(const d of drops){
    d.t += dt;
    if(!d.gone && D(d, hero) < 26 && d.it.rar >= S.cfg.minPick && S.inv.length < INV_MAX && mode === 'hunt'){
      d.gone = true; S.inv.push(d.it);
      if(d.it.rar >= 1) log(`Pegou ${d.it.name}`, RAR[d.it.rar].c);

function updateTown(dt){

  heroTimers(dt);

  else if(mode === 'town'){
    hero.moving = false;
    if(hero.hp < ST.life){
      hero.hp = Math.min(ST.life, hero.hp + ST.life*.4*dt);
      if(Math.random() < dt*14){ const an = Math.random()*TAU; part({x:hero.x + Math.cos(an)*14, y:hero.y + Math.sin(an)*8, vy:-50, life:.7, size:2, c:'#9fe0ff'}); }

function step(dt){

  parts = parts.filter(p => p.t < p.life);

    ctx.strokeStyle = `rgba(190,240,120,${.5*k})`; ctx.lineWidth = 1.5; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r, c.r*.8, T*.3, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  for(const d of drops) if(vis(d)) drawItemDrop(d);
  for(const c of coins){ ctx.fillStyle = '#8a6420'; circ(c.x, c.y + 1, 3.6); ctx.fillStyle = '#e2ae4a'; circ(c.x, c.y, 3.4); ctx.fillStyle = '#ffe39a'; circ(c.x - 1, c.y - 1, 1.2); }
  for(const m of mons) if(m.dead && vis(m)) drawMon(m);
  if(scene === 'map') drawFocus();
  if(portal) drawPortal(portal.x, portal.y, clamp(portal.t/.6, 0, 1));
  const ents = mons.filter(m => !m.dead && vis(m)); ents.push(hero); ents.sort((a, b) => a.y - b.y);
  for(const e of ents) e === hero ? drawHero() : drawMon(e);
  for(const p of projs){
    if(p.hostile){ ctx.fillStyle = p.c; circ(p.x, p.y, 4.5); ctx.globalAlpha = .35; circ(p.x, p.y, 8); ctx.globalAlpha = 1; continue; }
    const c = p.kind === 'arrow' ? '#e8e2d0' : p.kind === 'farrow' ? '#d8f07a' : '#9bd84a';
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
    if(p.kind !== 'arrow'){ ctx.fillStyle = 'rgba(155,216,74,.35)'; ell(0, 0, 14, 5); }
    ctx.strokeStyle = c; ctx.lineWidth = 2; line(-14, 0, 4, 0);
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3, -3.5); ctx.lineTo(3, 3.5); ctx.fill();
    ctx.fillStyle = '#c94a3a'; ctx.fillRect(-15, -2.5, 4, 5);
    ctx.restore();
  }
  for(const p of parts){
    const k = 1 - p.t/p.life; ctx.globalAlpha = Math.max(0, k);
    if(p.kind === 'streak'){ ctx.strokeStyle = p.c; ctx.lineWidth = p.size; line(p.x, p.y, p.x - p.vx*.04, p.y - p.vy*.04); }
    else if(p.kind === 'bubble'){ ctx.strokeStyle = p.c; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke(); }
    else { ctx.fillStyle = p.c; circ(p.x, p.y, p.size*(.5 + .5*k)); }
  }
  ctx.globalAlpha = 1;
  for(const r of rings){ const k = r.t/r.life; ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.c; ctx.lineWidth = r.w; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r*k + 4, (r.r*k + 4)*.75, 0, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
  drawAim();
  drawBars(vis);
  ctx.textAlign = 'center';
  for(const t of texts){ ctx.globalAlpha = Math.min(1, (1 - t.t/.9)*1.6); ctx.font = `800 ${t.size}px "Alegreya Sans", sans-serif`; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // vinheta
  const vg = ctx.createRadialGradient(cw/2, ch/2, Math.min(cw, ch)*.28, cw/2, ch/2, Math.max(cw, ch)*.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, scene === 'map' && mapDef.decor === 'hell' ? 'rgba(40,6,0,.75)' : 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);
  if(mode === 'dead'){ ctx.fillStyle = `rgba(90,0,0,${Math.min(.45, deadT*.3)})`; ctx.fillRect(0, 0, cw, ch); }
  if(fade > 0){ ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, cw, ch); }
}

/* ---------- LOOP ---------- */
let last = performance.now(), uiT = 0, saveT = 0;
function tickTrans(dt){
  if(!trans) return;
  trans.t += dt; const t = trans.t;
  fade = t < .35 ? t/.35 : t < .45 ? 1 : Math.max(0, 1 - (t - .45)/.35);
  if(!trans.did && t >= .35){ trans.did = true; trans.fn(); }
  if(t >= .8){ trans = null; fade = 0; }
}
function frame(now){
  let dt = Math.min(.05, (now - last)/1000); last = now;
  for(let i = 0; i < S.speed; i++) step(dt);
  tickTrans(dt);
  render();
  uiT -= dt; if(uiT <= 0){ uiT = .1; updateHud(); }
  saveT -= dt; if(saveT <= 0){ saveT = 5; save(); }
  rankTick(dt);
  requestAnimationFrame(frame);
}

const authMsg = e => e && e.code === 'auth/unauthorized-domain' ? 'Este site ainda não foi autorizado no Firebase (Authentication › Configurações › Domínios autorizados).' : 'Não foi possível entrar (' + ((e && e.code) || 'erro desconhecido') + ').';
function fbInit(){
  if(fb) return fb;
  if(!window.firebase || !FIREBASE_CONFIG.apiKey) return null;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fb = {auth: firebase.auth(), db: firebase.firestore()};
    fb.auth.onAuthStateChanged(u => { fbUser = u; if(u) rankDirty = true; if(tab === 'rank'){ loadRank(); dirtyPanel(); } });
    fb.auth.getRedirectResult().catch(e => { rankErr = authMsg(e); dirtyPanel(); });
  }catch(e){ rankErr = 'Não foi possível iniciar o Firebase.'; fb = null; }
  return fb;
}
async function rankLogin(){
  if(!fbInit()) return;
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
  rankErr = '';
  try{ await fb.auth.signInWithPopup(prov); }
  catch(e){
    if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return fb.auth.signInWithRedirect(prov);
    if(e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request'){ rankErr = authMsg(e); dirtyPanel(); }
  }
}
function pushRank(){
  if(!fb || !fbUser || !S.char) return;
  rankDirty = false; rankPushT = 60; lastScore = rankScore();
  fb.db.collection('ranking').doc(fbUser.uid).set({
    name: heroName(), lv: S.lv, par: S.par, score: lastScore, cls: S.char.cls || 'arqueiro', kills: S.kills,
    updated: firebase.firestore.FieldValue.serverTimestamp(),
  }).then(() => { if(tab === 'rank') loadRank(); })
    .catch(e => { rankErr = 'Não foi possível enviar sua pontuação (' + (e.code || 'erro') + ').'; if(tab === 'rank') dirtyPanel(); });
}
function rankTick(dt){
  if(!fbUser) return;
  rankPushT -= dt;
  if(rankDirty || (rankPushT <= 0 && Math.abs(rankScore() - lastScore) > 1e-4)) pushRank();
  else if(rankPushT <= 0) rankPushT = 60;
}
function loadRank(){
  if(!fbInit() || rankLoading) return;
  rankLoading = true;
  fb.db.collection('ranking').orderBy('score', 'desc').limit(RANK_N).get()
    .then(q => { rankList = q.docs.map(d => Object.assign({id: d.id}, d.data())); rankErr = ''; })
    .catch(e => { rankErr = 'Não foi possível carregar o ranking (' + (e.code || 'erro') + ').'; })
    .finally(() => { rankLoading = false; if(tab === 'rank') dirtyPanel(); });
}

  if(rankErr) h += `<p class="note" style="color:#ff8c80">${esc(rankErr)}</p>`;
  h += `<div class="sec"><h3>Top ${RANK_N} <span class="r"><button class="tog" data-act="rankRefresh">${rankLoading ? 'Carregando…' : 'Atualizar'}</button></span></h3>
    <p class="note">Ordem pelo nível. Depois do nível ${MAX_LV}, quem tem mais Paragon fica na frente.</p>`;
  if(rankList === null){ if(!rankErr) h += `<p class="note">Carregando…</p>`; }
  else if(!rankList.length) h += `<p class="note">Ninguém no ranking ainda. Seja o primeiro.</p>`;
  else h += `<ol class="rk-list">` + rankList.map((r, i) => {

  return h + `</div>`;
}

const DIFF_L = {wdmg:'de dano médio da arma', aps:'ataques/s', barmor:'de armadura base', life:'de vida', pois:'% de dano de veneno', ias:'% de velocidade de ataque', crit:'% de chance de crítico', critd:'% de dano crítico', ms:'% de velocidade de movimento', armor:'de armadura', ls:'% do dano vira vida', cdr:'% de redução de recarga', pdur:'% de duração do veneno', gf:'% de ouro encontrado'};

function itemVals(it){

function itemDiff(it, cur){

  for(const k of keys){

  unequip: () => { const it = findItem('eq', dlgItem.id); if(!it || S.inv.length >= INV_MAX) return; S.eq[it.slot] = null; S.inv.push(it); refreshStats(); closeDlg(); dirtyPanel(); save(); },
  sell: () => { if(!inTown()) return; const id = dlgItem.id; sellWhere(i => i.id === id); closeDlg(); },
  drop: () => { const id = dlgItem.id; S.inv = S.inv.filter(i => i.id !== id); closeDlg(); dirtyPanel(); },
  sellR: v => { if(!inTown()) return; const r = +v; sellWhere(i => i.rar === r); },
  reset: () => {
    if(resetArm < performance.now()){ resetArm = performance.now() + 3000; dirtyPanel(); setTimeout(dirtyPanel, 3050); return; }
    resetArm = 0; S = defaults(); refreshStats(); hero.hp = ST.life; for(const k in cds) cds[k] = 0; closeSheet(); save(); enterTown(); showCreate();
  },
  crPick: v => { const [k, id] = v.split(':'); crSel[k] = id; renderCreate(); },
  crColor: v => { crSel.color = +v; renderCreate(); },
  create: () => {
    const name = ($('#crName').value || '').trim().slice(0, 14) || 'Víbora';
    S = defaults(); S.char = {name, cls:crSel.cls, build:crSel.build, color:crSel.color};
    refreshStats(); hero.hp = ST.life; for(const k in cds) cds[k] = 0;
    $('#create').hidden = true; enterMap('campos'); save();
    log(`${name} parte para a primeira caçada`, '#9bd84a');
  },
  exportOpen: () => openExport(),
  importOpen: () => openImport(),
  copySave: () => {
    const ta = $('#saveOut'), msg = $('#saveMsg');
    const fallback = () => { ta.focus(); ta.select(); try{ document.execCommand('copy'); msg.textContent = 'Código copiado.'; }catch(e){ msg.textContent = 'Selecione o código e copie manualmente.'; } };
    try{ navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = 'Código copiado.'; }, fallback); }catch(e){ fallback(); }
  },
  downloadSave: () => {
    const blob = new Blob([encodeSave()], {type:'text/plain'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `save-${heroName()}-nv${S.lv}.txt`; document.body.appendChild(a); a.click(); a.remove();
    $('#saveMsg').textContent = 'Arquivo baixado.';
  },
  importLoad: () => { const o = decodeSave($('#saveIn').value); if(!o){ $('#saveMsg').textContent = 'Código inválido. Confira se copiou o texto inteiro, começando por VIBORA1.'; $('#saveMsg').style.color = '#ff8c80'; return; } applySave(o); },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(!b || b.disabled) return; const f = ACT[b.dataset.act]; if(f) f(b.dataset.v, b); });
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.cfg;
  if(k){ S.cfg[k] = el.type === 'checkbox' ? el.checked : +el.value; save(); }
});
document.addEventListener('input', e => { if(e.target.id === 'cfg-ret'){ S.cfg.ret = +e.target.value; $('#retVal').textContent = S.cfg.ret + '%'; } });
document.addEventListener('change', e => {
  if(e.target.id !== 'saveFile' || !e.target.files[0]) return;
  const r = new FileReader(); r.onload = () => { $('#saveIn').value = String(r.result || ''); $('#saveMsg').textContent = 'Arquivo lido. Toque em Carregar save.'; }; r.readAsText(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if(e.target.closest('input,textarea')) return;
  const i = '1234'.indexOf(e.key);
  if(i >= 0){
    const id = ACTIVE[i];
    if(AIMABLE[id]){ if(e.repeat || aim) return; if(canAim(id)){ aim = {id, src:'key', key:e.key}; return; } }
    if(id === 'arrow'){ const h = hoverMon(); if(h){ if(!e.repeat) setFocus(h); manualCast(id, {tgt:h}); return; } }
    manualCast(id);
  }
  if(e.key === 'Escape' && aim){ aim = null; return; }
  if(e.key.toLowerCase() === 't') ACT.goTown();
});
document.addEventListener('keyup', e => { if(aim && aim.src === 'key' && e.key === aim.key) aimRelease(); });
window.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.on = true; });
window.addEventListener('contextmenu', e => { if(aim){ e.preventDefault(); aim = null; } });
window.addEventListener('blur', () => { aim = null; });
// Clicar/tocar numa criatura troca o alvo; tocar no chão vazio volta ao alvo automático
cv.addEventListener('pointerdown', e => {
  if(e.button > 0 || scene !== 'map' || mode !== 'hunt') return;
  const r = cv.getBoundingClientRect();
  setFocus(monAt(e.clientX - r.left, e.clientY - r.top, e.pointerType === 'mouse' ? 6 : 22));
});
// Mira por toque: segura no botão, arrasta e solta
$('#skillbar').addEventListener('pointerdown', e => {
  if(e.pointerType === 'mouse' || aim) return;
  const b = e.target.closest('.sk'); if(!b || !canAim(b.dataset.v)) return;
  aim = {id:b.dataset.v, src:'touch', pid:e.pointerId, ox:e.clientX, oy:e.clientY, dx:0, dy:0, moved:false};
  try{ b.setPointerCapture(e.pointerId); }catch(_){}
});
window.addEventListener('pointermove', e => {
  if(!aim || aim.src !== 'touch' || e.pointerId !== aim.pid) return;
  aim.dx = e.clientX - aim.ox; aim.dy = e.clientY - aim.oy;
  if(Math.hypot(aim.dx, aim.dy) > AIM_DEAD) aim.moved = true;
  e.preventDefault();
}, {passive:false});
const touchEnd = cancel => e => {
  if(!aim || aim.src !== 'touch' || e.pointerId !== aim.pid) return;
  skipClickT = performance.now() + 500;
  if(cancel) aim = null; else aimRelease();
};
window.addEventListener('pointerup', touchEnd(false));
window.addEventListener('pointercancel', touchEnd(true));
$('#skillbar').addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
window.addEventListener('pagehide', save);

/* ---------- INÍCIO ---------- */
buildSkillbar();
fbInit();
hero.hp = ST.life;
if(S.char) enterMap(S.map); else { enterTown(); showCreate(); }
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
window.__game = {manualCast, step, tickTrans, updateHud, get S(){ return S; }, get mode(){ return mode; }, get scene(){ return scene; }, hero, ACT, get ST(){ return ST; }, render};
})();
</script>
