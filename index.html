<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0f0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="css/estilo.css?v=23">

<div id="app">
  <header class="hud gut">
    <div class="hud-top">
      <span class="hero-id" id="heroName">Herói</span><span class="lvl" id="lvText">Nv 1</span>
      <span class="gold"><i></i><span id="goldText">0</span></span>
    </div>
    <div class="xp" aria-hidden="true"><i id="xpBar"></i></div>
    <div class="status"><span class="dot" id="stDot"></span><span id="stText">Caçando</span><span id="hpText"></span></div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="log" aria-live="polite"></div>
    <button id="townBtn" data-act="goTown" hidden aria-label="Voltar para a vila"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="6" ry="9"/><ellipse cx="12" cy="12" rx="2.5" ry="5" fill="currentColor" fill-opacity=".35"/></svg>Voltar à vila</button>
    <!-- Minimapa (nos mapas): toque para abrir grande; embaixo, quantas criaturas faltam -->
    <div id="mmWrap" hidden><canvas id="mm" data-act="mmToggle" aria-label="Minimapa (toque para ampliar)"></canvas><div id="mmLeft"></div></div>
    <!-- Na vila só existe o botão Partir; Mercador, Forja, Armazém e Masmorra se abrem andando até eles -->
    <button id="goBtn" data-act="go" hidden aria-label="Partir para a caçada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h12M13 7l5 5-5 5"/></svg><span id="goText">Partir</span></button>
    <!-- Ataque e habilidades em leque no canto de baixo à direita (posições em buildSkillbar) -->
    <div class="skillbar" id="skillbar"></div>
  </main>
  <nav class="nav gut" id="nav">
    <button data-act="tab" data-v="maps" id="nav-maps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapas</button>
    <button data-act="tab" data-v="hero" id="nav-hero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 21c0-5 3-7 7-7s7 2 7 7"/><path d="M7 11c0-5 2-8 5-8s5 3 5 8c-1.5 1.5-3 2-5 2s-3.5-.5-5-2z"/></svg>Herói<span class="badge" id="ptsBadge" hidden>0</span></button>
    <button data-act="tab" data-v="bag" id="nav-bag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 9h14l-1 12H6z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>Mochila<span class="badge" id="bagBadge" hidden>0</span></button>
    <button data-act="tab" data-v="rank" id="nav-rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/></svg>Ranking</button>
    <button data-act="tab" data-v="rules" id="nav-rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Regras</button>
  </nav>
</div>

<div id="sheet" hidden>
  <div class="sheet-back" data-act="close"></div>
  <section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head gut"><h2 id="sheetTitle">Mapas</h2><button class="btn" data-act="close">Fechar</button></div>
    <div class="sheet-body gut" id="sheetBody"></div>
  </section>
</div>
<div id="create" hidden><div class="cr gut" id="crBody"></div></div>
<div id="login"><div class="cr gut" id="loginBody"></div></div>
<div id="upd" hidden><div class="upd-card"><b>Nova versão do Loner</b><p>Saiu uma atualização do jogo. Seu progresso já está salvo.</p><button class="btn primary" id="updBtn" data-act="update">Atualizar agora</button></div></div>
<div id="rotate"><div><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><rect x="16" y="6" width="16" height="28" rx="3"/><path d="M8 30a18 18 0 0 0 16 12M8 30l-3 5M8 30l6 2"/></svg><b>Gire o celular</b><p>O Loner é jogado com o celular deitado.</p></div></div>
<div id="dlg" hidden>
  <div class="sheet-back" data-act="dlgClose"></div>
  <div class="dcard" id="dcard"></div>
</div>

<script src="js/03-mapa.js?v=23"></script>
